name: Pin released SDK in template
on:
  push:
    branches: [chore/pin-public-template]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
      - name: Install public release in template
        env:
          ARCHIVE: https://github.com/sborod/labkit/releases/download/v0.1.1/labkit-0.1.1.tgz
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --location --max-time 15 "$ARCHIVE.sha256" -o "$RUNNER_TEMP/labkit.sha256"; then
              break
            fi
            sleep 10
          done
          test -s "$RUNNER_TEMP/labkit.sha256"
          curl --fail --silent --show-error --location "$ARCHIVE" -o "$RUNNER_TEMP/labkit-0.1.1.tgz"
          (cd "$RUNNER_TEMP" && sha256sum -c labkit.sha256)
          npm install --prefix templates/lab-template --save-exact "labkit@$ARCHIVE"
          npm ci --prefix templates/lab-template
          npm run verify --prefix templates/lab-template
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/lab-template/package.json templates/lab-template/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Pin template to public LabKit v0.1.1 archive"
            git push origin HEAD:chore/pin-public-template
          fi
