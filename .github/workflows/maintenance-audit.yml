name: Maintenance audit
on:
  push:
    branches: [chore/final-maintenance]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Audit existing lockfile
        run: |
          npm audit --json > /tmp/before.json || true
          node -e 'const a=require("/tmp/before.json"); if (!a.metadata) { console.error(a); process.exit(1); } console.log(JSON.stringify({metadata:a.metadata,vulnerabilities:a.vulnerabilities}))'
      - name: Generate synchronized lockfile
        run: |
          if [ "$(node -p "require('./package.json').devDependencies['typescript-eslint']")" != 8.74.0 ]; then
            npm install --package-lock-only --ignore-scripts --save-dev --save-exact typescript-eslint@8.74.0
          fi
          npm audit --json > /tmp/after.json || true
          node -e 'const a=require("/tmp/after.json"); if (!a.metadata) { console.error(a); process.exit(1); } console.log(JSON.stringify({metadata:a.metadata,vulnerabilities:a.vulnerabilities}))'
          git diff -- package.json package-lock.json
      - name: Validate npm installation
        run: npm ci
