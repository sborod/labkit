name: Prepare public release
on:
  push:
    branches: [chore/public-release]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
      - name: Generate manifests and format
        run: |
          npm version 0.1.1 --no-git-tag-version --ignore-scripts
          npm install --prefix templates/lab-template --package-lock-only --save-exact 'git+https://github.com/sborod/labkit.git#15dae831f590f371a7ed2da50735afd0703e8fd7' --ignore-scripts
          npm ci
          npm run format
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .
          if ! git diff --cached --quiet; then
            git commit -m "Generate public release manifests and formatting"
            git push origin HEAD:chore/public-release
          fi
