<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LabKit controls fixture</title>
    <style>
      /* Локальное оформление через className: обёрнутый ряд становится flex-контейнером. */
      .classed-flex-host > .labkit-row {
        display: flex;
        flex-wrap: nowrap;
        align-items: flex-start;
        gap: 8px;
      }
      .classed-flex-host > .labkit-row > * {
        flex: 1 1 0;
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./controls.ts"></script>
  </body>
